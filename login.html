<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBite Express | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

    <div class="auth-container">
        <div class="auth-header">
            <h2>Welcome Back</h2>
            <p>Log in to access your dashboard</p>
        </div>

        <form action="dashboard.html" method="GET" class="auth-form">
            <div class="form-group">
                <label for="role">Account Type</label>
                <select id="role" name="role" required class="form-input">
                    <option value="customer">Customer / User</option>
                    <option value="admin">Restaurant Admin</option>
                </select>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required class="form-input">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required class="form-input">
            </div>

            <button type="submit" class="btn btn-primary btn-full">Login</button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
            <p><a href="index.html">← Back to Home</a></p>
        </div>
    </div>

</body>
</html>
